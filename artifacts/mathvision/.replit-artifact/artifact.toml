kind = "web"
previewPath = "/"
title = "MathVision"
version = "1.0.0"
id = "artifacts/mathvision"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20120

[services.development]
run = "pnpm --filter @workspace/mathvision run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mathvision", "run", "build" ]
serve = "static"
publicDir = "artifacts/mathvision/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20120"
BASE_PATH = "/"
